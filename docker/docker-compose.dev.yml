version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
      target: build
    container_name: dotnet-vue-backend-dev
    ports:
      - "5084:5084"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5084
    volumes:
      - ../backend:/src
      - backend-nuget:/root/.nuget/packages
    networks:
      - app-network
    command: ["dotnet", "watch", "run", "--project", "/src/backend.csproj"]
    restart: unless-stopped

  frontend:
    image: node:24-alpine
    container_name: dotnet-vue-frontend-dev
    working_dir: /app
    ports:
      - "9000:9000"
    environment:
      - NODE_ENV=development
      - VITE_API_HOST=http://backend
      - VITE_API_PORT=5084
    volumes:
      - ../frontend:/app
      - frontend-node-modules:/app/node_modules
    networks:
      - app-network
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
    name: dotnet-vue-network-dev

volumes:
  backend-nuget:
    name: dotnet-vue-backend-nuget
  frontend-node-modules:
    name: dotnet-vue-frontend-node-modules
